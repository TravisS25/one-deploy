---
runtime_dir: /var/one-deploy/
os_image_url: https://d24fmfybwxpuhu.cloudfront.net/ubuntu2204-6.8.1-1-20240131.qcow2
os_image_size: 20G
memory_KiB: 2097152 # 2 GiB
vcpu_static: 1
vnc_max_port: 65535
infra_bridge: br0
passthrough_fs: []
disk_bus_type: scsi
frontend_vm_name: onecloud-01
firmware_type: bios
secure_boot: false
uefi_loader: /usr/share/OVMF/OVMF_CODE.fd
uefi_loader_secure: /usr/share/OVMF/OVMF_CODE.secboot.fd
uefi_nvram_dir: /var/lib/libvirt/qemu/nvram
autostart_frontend_vm: false

# Default frontend NIC MAC: "02:01" + the NIC's IPv4 octets in hex.
# Single source of truth for context.sh.j2 and frontend.xml.j2 so the guest
# interface MAC always matches the ETH{n}_MAC one-context expects.
context_mac_format: "02:01:%02x:%02x:%02x:%02x"
